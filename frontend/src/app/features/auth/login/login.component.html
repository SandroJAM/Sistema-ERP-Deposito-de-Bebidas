<div class="pagina-login">
  <div class="cartao-login">
    <div class="marca">
      <span class="marca__gota" aria-hidden="true"></span>
      <div>
        <h1>Controle de Vendas</h1>
        <p class="marca__subtitulo">Bebidas &amp; outros produtos</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      <label class="campo">
        <span>E-mail</span>
        <input type="email" formControlName="email" placeholder="voce@exemplo.com" autocomplete="username" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <small class="campo__erro">Informe um e-mail válido.</small>
        }
      </label>

      <label class="campo">
        <span>Senha</span>
        <input type="password" formControlName="senha" placeholder="••••••••" autocomplete="current-password" />
        @if (form.get('senha')?.invalid && form.get('senha')?.touched) {
          <small class="campo__erro">Informe sua senha.</small>
        }
      </label>

      @if (erro()) {
        <div class="alerta" role="alert">{{ erro() }}</div>
      }

      <button type="submit" class="botao-entrar" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
