spring.application.name=controle-vendas-bebidas

# --- Banco de dados (PostgreSQL) ---
# Crie o banco antes: createdb controle_vendas_bebidas
spring.datasource.url=jdbc:postgresql://localhost:5432/controle_vendas_bebidas
spring.datasource.username=postgres
spring.datasource.password=#jam271324@
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" gera/ajusta as tabelas automaticamente em dev.
# Trocar para "validate" quando tiver migrations (ex: Flyway) em produção.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor ---
server.port=8080

# --- CORS (liberado para o Angular local; ajustar em produção) ---
app.cors.allowed-origins=http://localhost:4200

# --- JWT ---
# Chave usada para assinar os tokens. TROQUE em produção por um valor longo e secreto
# (nunca versione a chave real — use variável de ambiente).
app.jwt.secret=troque-esta-chave-por-uma-bem-longa-e-secreta-em-producao-minimo-32-bytes
# 1 dia em milissegundos
app.jwt.expiration-ms=86400000
